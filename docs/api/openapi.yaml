openapi: 3.0.3
info:
  title: SuperArtillery REST API
  version: 1.0.0
  description: >-
    Concise REST contract generated from current server implementation.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/register:
    post:
      summary: Register a player
      operationId: registerPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid player name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                details: Name is required
        '403':
          description: Server full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                details: Server is full
        '409':
          description: Duplicate player name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                details: Player Alice already registered
  /api/v1/fire:
    post:
      summary: Fire a shot
      operationId: fireShot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireRequest'
      responses:
        '200':
          description: Shot accepted
        '400':
          description: Validation or state error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownGame:
                  value:
                    details: GameId 99 is unknown.
                unknownPlayer:
                  value:
                    details: PlayerId 2 is unknown.
                wrongTurn:
                  value:
                    details: Player should wait for its turn to fire.
                invalidAngle:
                  value:
                    details: The angle should be within 0-360 degrees.
                invalidVelocity:
                  value:
                    details: The velocity should be positive.
components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    RegisterResponse:
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: integer
          enum: [0, 1]
    FireRequest:
      type: object
      required:
        - gameId
        - playerId
        - angle
        - velocity
      properties:
        gameId:
          type: number
        playerId:
          type: integer
          enum: [0, 1]
        angle:
          type: number
          minimum: 0
          maximum: 360
        velocity:
          type: number
          minimum: 0
          exclusiveMinimum: true
    ErrorResponse:
      type: object
      required:
        - details
      properties:
        details:
          type: string
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - uptime
        - players
        - version
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        players:
          type: integer
          minimum: 0
          maximum: 2
        version:
          type: string
