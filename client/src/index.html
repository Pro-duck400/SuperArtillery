<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperArtillery</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Registration / Lobby Panel -->
    <div id="registrationPanel" style="display: block;">
      <h2>Welcome to SuperArtillery!</h2>
      <div id="registrationFields">
        <label id="serverAddressLabel">
          Enter your name:
          <input type="text" id="playerNameInput" placeholder="Your name" maxlength="20" />
        </label>
        <label>
          Server address:
          <span class="server-address-combobox">
            <input type="text" id="serverAddressInput" role="combobox" aria-controls="serverAddressOptions" aria-expanded="false" />
            <button type="button" id="serverAddressToggle" aria-label="Show server address options" aria-expanded="false">&#9662;</button>
            <span id="serverAddressOptions" role="listbox" hidden>
              <button type="button" role="option" data-server-address="https://superartillery-server-production.up.railway.app">https://superartillery-server-production.up.railway.app</button>
              <button type="button" role="option" data-server-address="http://localhost:3000">http://localhost:3000</button>
            </span>
          </span>
        </label>
      </div>
      <div id="registrationActions" style="display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap;">
        <label id="inviteInputLabel" style="display: flex; align-items: center; gap: 8px;">
          Invite code:
          <input type="text" id="inviteInput" placeholder="ABCD" maxlength="4" autocomplete="off" />
        </label>
        <button id="actionButton">Create Private Game</button>
      </div>
      <div id="registrationError" style="color: red; margin-top: 10px;"></div>
      <div id="inviteInfo" style="margin-top: 12px; display: none;">
        <div style="display: flex; align-items: center; gap: 6px;">
          Invite code: <span id="inviteCodeText"></span>
          <button id="copyInviteCodeButton" title="Copy invite code" style="font-size: 12px; padding: 2px 6px;">📋 Copy</button>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          Invite URL: <span id="inviteUrlText"></span>
          <button id="copyInviteUrlButton" title="Copy invite URL" style="font-size: 12px; padding: 2px 6px;">📋 Copy</button>
        </div>
      </div>
    </div>
    
    <!-- Game Panel (hidden initially) -->
    <div id="gamePanel" style="display: none;">
      <div id="battlefieldFrame">
        <div id="windLabel" aria-label="Wind strength"></div>
        <canvas id="gameCanvas" width="280" height="160"></canvas>
        <div id="playerNameLeft" class="player-name-overlay player-name-left">...</div>
        <div id="playerNameRight" class="player-name-overlay player-name-right">...</div>
      </div>
      
      <div id="controls">
        <label>
          Angle (0-90):
          <input type="number" id="angleInput" min="0" max="90" value="45" />
        </label>
        <label>
          Velocity (0-350):
          <input type="number" id="velocityInput" min="0" max="300" value="150" />
        </label>
        <button id="fireButton" disabled>Fire!</button>
      </div>

      <section id="shotHistory" aria-labelledby="shotHistoryTitle">
        <h2 id="shotHistoryTitle">Your last four shots</h2>
        <table aria-label="Your last four shots">
          <tbody id="shotHistoryRows" aria-live="polite"></tbody>
        </table>
      </section>
      
      <div id="message"></div>
      <button id="rematchButton" type="button" style="display: none;">Play again</button>
    </div>
    <div id="clientVersion" aria-label="Client version"></div>
  </div>
  
  <script type="module" src="/ts/main.ts"></script>
</body>
</html>
