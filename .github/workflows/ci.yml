name: CI

on:
  push:
  pull_request:

jobs:
  server-build:
    name: Server Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install contract generator
        working-directory: .
        run: npm ci

      - name: Install server dependencies
        run: npm ci

      - name: Build server
        run: npm run build

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install contract generator
        working-directory: .
        run: npm ci

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build
