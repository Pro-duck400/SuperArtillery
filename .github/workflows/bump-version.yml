name: Bump Server And Client Versions

# Runs only when a PR is actually merged into main (not just closed without merging).
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump server minor version
        working-directory: server
        run: npm version minor --no-git-tag-version

      - name: Bump client minor version
        working-directory: client
        run: npm version minor --no-git-tag-version

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json client/package.json client/package-lock.json
          git commit -m "chore: bump server/client minor versions"
          git push origin HEAD:main
